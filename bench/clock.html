<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
  html, body { margin: 0; height: 100%; background: #808080; overflow: hidden; }
  /* 6x4 grid of 67pt blocks: row 0 is a fixed reference (W B W B W B), rows 1-3 carry 18 bits of
     Date.now() modulo 2^18 ms. Big, high-contrast blocks survive any encoder. */
  #code { position: fixed; left: 0; top: 150px; width: 402px; display: grid; grid-template-columns: repeat(6, 67px); }
  #code div { width: 67px; height: 67px; }
  #heavy { position: fixed; left: 0; right: 0; top: 440px; bottom: 0; overflow: hidden; background: #000; color: #fff; font: 9px -apple-system; }
  #g { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 6px; transform-origin: 50% 30%; }
  .m { display: grid; grid-template-columns: repeat(7, 1fr); } .m b { grid-column: 1/8; color: #f44; }
</style>
<div id="code"></div>
<div id="heavy"><div id="g"></div></div>
<script>
  const code = document.getElementById('code'); const cells = [];
  for (let i = 0; i < 24; i++) { const d = document.createElement('div'); code.appendChild(d); cells.push(d); }
  for (let i = 0; i < 6; i++) cells[i].style.background = i % 2 ? '#000' : '#fff';
  const heavy = location.hash === '#heavy';
  if (heavy) { let h = ''; for (let m = 0; m < 24; m++) { h += '<div class=m><b>M' + m + '</b>'; for (let d = 1; d <= 31; d++) h += '<span>' + d + '</span>'; h += '</div>'; } document.getElementById('g').innerHTML = h; }
  else document.getElementById('heavy').style.background = '#808080';
  function tick() {
    const t = Date.now() & 0x3ffff;
    for (let b = 0; b < 18; b++) cells[6 + b].style.background = (t >> (17 - b)) & 1 ? '#fff' : '#000';
    if (heavy) document.getElementById('g').style.transform = 'scale(' + (1.4 + 0.4 * Math.sin(performance.now() / 700)) + ')';
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
