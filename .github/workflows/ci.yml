name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR updates replace previous runs; each main push gets its own group.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # --only prevents dependencies from reintroducing the macOS-only serve-sim build.
      - name: Build packages (excluding serve-sim)
        run: bun run build --filter='!@expo/serve-sim' --only

      - name: Typecheck
        run: bunx turbo run typecheck --only

      - name: Test
        run: bun run test

      - name: Serve-emu critical coverage
        run: bun run --filter serve-emu coverage

      - name: Serve-emu documentation and package checks
        run: |
          bun run --filter serve-emu docs:check
          bun run --filter serve-emu test:package

  serve-sim:
    name: serve-sim (EAS)
    # Fork PRs do not receive the Expo token. Their lint/typecheck still run above.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          package-manager-cache: false

      - name: Build and test serve-sim with EAS
        working-directory: packages/serve-sim
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_DEV_EXPO_GITHUB_ROBOT_ACCESS_TOKEN }}
          CI_REF: ${{ github.event.pull_request.number || github.run_id }}
        # Upload this checkout, including serve-emu, instead of resolving --ref
        # against the repository currently linked to the serve-sim EAS project.
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Expose EXPO_DEV_EXPO_GITHUB_ROBOT_ACCESS_TOKEN to this repository to run serve-sim CI."
            exit 1
          fi
          npx --yes eas-cli@23.2.0 workflow:run .eas/workflows/sim-test.yml \
            --input "ci_ref=$CI_REF" \
            --wait \
            --non-interactive
