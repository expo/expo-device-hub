name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      canary:
        description: "Canary"
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-publish
    env:
      IS_CANARY: ${{ github.event_name == 'push' || inputs.canary }}
      RELEASE_BRANCH: release/${{ github.run_number }}-${{ github.run_attempt }}
    permissions:
      contents: write # push package tags and the tested release commit
      id-token: write # npm OIDC Trusted Publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_DEV_EXPO_GITHUB_ROBOT_ACCESS_TOKEN }}
        run: |
          npx --yes eas-cli@24.7.0 workflow:run .eas/workflows/build-release.yml \
            --ref "$(git rev-parse HEAD)" \
            --input "canary=${IS_CANARY}" \
            --input "release_branch=${RELEASE_BRANCH}" \
            --wait \
            --non-interactive \
            --json > /tmp/eas-workflow.json

      - name: Download npm packages from EAS
        run: |
          ARTIFACT_URL=$(jq -er '
            .jobs[]
            | .turtleJobRun.artifacts[]?
            | select(.name == "npm-packages")
            | .downloadUrl
          ' /tmp/eas-workflow.json)
          curl --fail --location "$ARTIFACT_URL" --output /tmp/npm-packages.tgz
          mkdir -p release-artifacts
          tar -xzf /tmp/npm-packages.tgz -C release-artifacts
          ls -l release-artifacts

      - name: Checkout release commit
        if: ${{ env.IS_CANARY != 'true' }}
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          RELEASE_SHA=$(cat release-artifacts/release-commit.txt)
          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::EAS did not return a valid release commit SHA."
            exit 1
          fi
          git fetch --depth=2 origin "$RELEASE_SHA"
          git checkout --detach "$RELEASE_SHA"
          if [ "$(git rev-parse HEAD^)" != "$SOURCE_SHA" ]; then
            echo "::error::The release commit does not belong to this workflow's source commit."
            exit 1
          fi

      - name: Publish to npm
        if: ${{ env.IS_CANARY != 'true' }}
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: ./scripts/publish-packages.ts release-artifacts

      - name: Publish canary to npm
        if: ${{ env.IS_CANARY == 'true' }}
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: ./scripts/publish-packages.ts release-artifacts --canary

      - name: Create GitHub releases
        if: ${{ env.IS_CANARY != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/create-github-releases.ts release-artifacts

      - name: Update main and delete release branch
        if: ${{ env.IS_CANARY != 'true' }}
        run: |
          git push origin HEAD:refs/heads/main
          git push origin --delete "$RELEASE_BRANCH"
