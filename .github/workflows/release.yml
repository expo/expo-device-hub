name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      canary:
        description: "Canary"
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-emulator-capture:
    # Pin the build environment instead of changing the Linux ABI with ubuntu-latest.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/@expo/emulator-capture
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"

      - name: Install emulator capture build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang libc++-dev libc++abi-dev libegl-dev libgl-dev pkg-config git curl tar xz-utils

      # These standalone scripts need no workspace install, GPU, or NVIDIA driver.
      - name: Build emulator capture
        run: bun run build

      - name: Test native format and pacing
        run: bun run test:native

      # Transfer only runtime outputs; tar preserves the injector's executable bit.
      - name: Archive Linux binaries
        run: |
          test -s dist/linux-x64/inject
          test -x dist/linux-x64/inject
          test -s dist/linux-x64/libgpu_capture.so
          tar -czf "$RUNNER_TEMP/emulator-capture-linux-x64.tar.gz" -C dist linux-x64/inject linux-x64/libgpu_capture.so

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v7
        with:
          name: emulator-capture-linux-x64
          path: ${{ runner.temp }}/emulator-capture-linux-x64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    needs: build-emulator-capture
    runs-on: macos-latest
    environment: npm-publish
    env:
      IS_CANARY: ${{ github.event_name == 'push' || inputs.canary }}
    permissions:
      contents: write # push the release commit + tags
      id-token: write # npm OIDC Trusted Publishing
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      # Restore after builds so the macOS skip/cache cannot replace Linux outputs.
      # npm packs them later using the final version assigned by Changesets.
      - name: Download Linux emulator capture binaries
        uses: actions/download-artifact@v8
        with:
          name: emulator-capture-linux-x64
          path: ${{ runner.temp }}/emulator-capture

      - name: Restore Linux emulator capture binaries
        working-directory: packages/@expo/emulator-capture
        run: |
          mkdir -p dist
          tar -xzf "$RUNNER_TEMP/emulator-capture/emulator-capture-linux-x64.tar.gz" -C dist
          test -s dist/linux-x64/inject
          test -x dist/linux-x64/inject
          test -s dist/linux-x64/libgpu_capture.so

      - name: Test
        run: bun run test

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verify pending changesets
        if: ${{ env.IS_CANARY != 'true' }}
        run: ./scripts/verify-pending-changesets.ts

      - name: Apply version bump & generate changelog
        run: bun run changeset:version

      - name: Apply canary version
        if: ${{ env.IS_CANARY == 'true' }}
        run: ./scripts/apply-canary-version.ts

      - name: Summarize versions
        run: ./scripts/summarize-versions.ts

      - name: Commit & push version bump
        if: ${{ env.IS_CANARY != 'true' }}
        run: |
          git add -A
          git commit -m "chore(release): version packages"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Ignore packages excluded from release
        run: ./scripts/ignore-packages.ts

      - name: Publish to npm
        if: ${{ env.IS_CANARY != 'true' }}
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: bun run changeset:publish

      - name: Publish canary to npm
        if: ${{ env.IS_CANARY == 'true' }}
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: bun run changeset:publish -- --tag canary

      - name: Push git tags
        if: ${{ env.IS_CANARY != 'true' }}
        run: git push origin --tags

      - name: Create GitHub releases
        if: ${{ env.IS_CANARY != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/create-github-releases.ts
