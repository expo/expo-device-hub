name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      canary:
        description: "Canary"
        required: false
        default: false
        type: boolean

# Automatic canary releases from pushes to main share one group, so a newer
# push cancels the previous run. Each manual release gets its own group, so
# it is never cancelled or replaced by a later run.
concurrency:
  group: ${{ github.event_name == 'push' && 'release-canary-auto' || format('release-manual-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # serve-sim and expo-emulator-capture build native macOS binaries, and
  # expo-emulator-capture also a Linux agent that needs Ubuntu 26.04's x264 header.
  # EAS macOS and Linux jobs build this commit and write the Turborepo remote cache;
  # the Ubuntu release job then reads it.
  build-cache:
    runs-on: ubuntu-latest
    env:
      IS_CANARY: ${{ github.event_name == 'push' || inputs.canary }}
    permissions:
      contents: read
    outputs:
      canary-id: ${{ steps.canary-id.outputs.canary-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"

      # Both jobs pass this to apply-canary-version.ts, so they write the same
      # canary versions even when the runs cross midnight UTC.
      - name: Compute canary id
        id: canary-id
        run: echo "canary-id=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build packages on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_CI_ROBOT_ACCESS_TOKEN }}
          CANARY_ID: ${{ steps.canary-id.outputs.canary-id }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_CI_ROBOT_ACCESS_TOKEN is not set."
            exit 1
          fi
          npx --yes eas-cli@24.14.0 workflow:run .eas/workflows/build-release-cache.yml \
            --ref "$GITHUB_SHA" \
            --input "canary=${IS_CANARY}" \
            --input "canary_id=${CANARY_ID}" \
            --wait \
            --non-interactive

  release:
    needs: build-cache
    runs-on: ubuntu-latest
    environment: npm-publish
    env:
      IS_CANARY: ${{ github.event_name == 'push' || inputs.canary }}
      CANARY_ID: ${{ needs.build-cache.outputs.canary-id }}
      # Read-only access to the remote cache that build-cache wrote.
      TURBO_TOKEN: readonly
      TURBO_CACHE: local:rw,remote:r
    permissions:
      contents: write # push the release commit + tags
      id-token: write # npm OIDC Trusted Publishing
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verify pending changesets
        if: ${{ env.IS_CANARY != 'true' }}
        run: ./scripts/verify-pending-changesets.ts

      - name: Apply version bump & generate changelog
        run: bun run changeset:version

      - name: Apply canary version
        if: ${{ env.IS_CANARY == 'true' }}
        run: ./scripts/apply-canary-version.ts

      - name: Summarize versions
        run: ./scripts/summarize-versions.ts

      # serve-sim and expo-emulator-capture must be remote cache hits: serve-sim's
      # native build fails on Linux, and the generic expo-emulator-capture build is
      # its macOS agent, which only warns here.
      - name: Build packages
        run: bun run build

      # A cache hit from the EAS Linux job. A miss builds it here, which needs g++
      # and the x264 build 165 header (Ubuntu 26.04 libx264-dev); without them the
      # build fails and nothing is published.
      - name: Build the Linux capture agent
        run: bunx turbo run build:linux-x64 --filter=expo-emulator-capture

      # changeset publish starts every publish at once, so the agents' prepublishOnly would stop
      # only the agent package, and the Hub would publish with a pin to a version that is not
      # on npm. Check both agents here, before the version commit.
      - name: Check the capture agents
        run: node packages/expo-emulator-capture/scripts/check-dist.mjs

      - name: Test
        run: bun run test

      - name: Commit & push version bump
        if: ${{ env.IS_CANARY != 'true' }}
        run: |
          git add -A
          git commit -m "chore(release): version packages"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Publish to npm
        if: ${{ env.IS_CANARY != 'true' }}
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: bun run changeset:publish

      - name: Publish canary to npm
        if: ${{ env.IS_CANARY == 'true' }}
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: bun run changeset:publish -- --tag canary

      - name: Push git tags
        if: ${{ env.IS_CANARY != 'true' }}
        run: git push origin --tags

      - name: Create GitHub releases
        if: ${{ env.IS_CANARY != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/create-github-releases.ts
