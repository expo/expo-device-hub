name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      canary:
        description: "Canary"
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-publish
    env:
      IS_CANARY: ${{ github.event_name == 'push' || inputs.canary }}
    permissions:
      contents: write # push the release commit + tags
      id-token: write # npm OIDC Trusted Publishing
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verify pending changesets
        if: ${{ env.IS_CANARY != 'true' }}
        run: ./scripts/verify-pending-changesets.ts

      - name: Apply version bump & generate changelog
        if: ${{ env.IS_CANARY != 'true' }}
        run: bun run changeset:version

      - name: Summarize versions
        if: ${{ env.IS_CANARY != 'true' }}
        run: ./scripts/summarize-versions.ts

      - name: Commit & push version bump
        if: ${{ env.IS_CANARY != 'true' }}
        run: |
          git add -A
          git commit -m "chore(release): version packages"
          git push origin "HEAD:${{ github.ref_name }}"

      # EAS builds and tests the pushed commit on a macOS worker and packs the
      # publishable packages. Canary versions are applied there; see
      # .eas/workflows/build-release.yml.
      - name: Build packages on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_DEV_EXPO_GITHUB_ROBOT_ACCESS_TOKEN }}
        run: |
          npx --yes eas-cli@24.7.0 workflow:run .eas/workflows/build-release.yml \
            --ref "$(git rev-parse HEAD)" \
            --input "canary=${IS_CANARY}" \
            --wait \
            --non-interactive \
            --json > /tmp/eas-workflow.json

      - name: Download npm packages from EAS
        run: |
          ARTIFACT_URL=$(jq -er '
            .jobs[]
            | .turtleJobRun.artifacts[]?
            | select(.name == "npm-packages")
            | .downloadUrl
          ' /tmp/eas-workflow.json)
          curl --fail --location "$ARTIFACT_URL" --output /tmp/npm-packages.tgz
          mkdir -p release-artifacts
          tar -xzf /tmp/npm-packages.tgz -C release-artifacts
          ls -l release-artifacts

      - name: Publish to npm
        if: ${{ env.IS_CANARY != 'true' }}
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: ./scripts/publish-packages.ts release-artifacts

      - name: Publish canary to npm
        if: ${{ env.IS_CANARY == 'true' }}
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: ./scripts/publish-packages.ts release-artifacts --canary

      - name: Push git tags
        if: ${{ env.IS_CANARY != 'true' }}
        run: git push origin --tags

      - name: Create GitHub releases
        if: ${{ env.IS_CANARY != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/create-github-releases.ts release-artifacts
