name: NVIDIA capture build (no GPU)
on:
  pull_request:
    paths:
      - "packages/expo-emulator-capture/**"
      - ".github/workflows/emulator-capture-nvidia.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Validate LLP references
        run: python3 .llp/ref-check --root .
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y clang make pkg-config
      - name: Build NVIDIA agent without GPU or x264
        working-directory: packages/expo-emulator-capture
        run: bun run build:linux-nvidia
      - name: Run portable native checks (no driver/device required)
        working-directory: packages/expo-emulator-capture
        run: bun run test:native
      - name: Check exported symbols and runtime dependencies
        working-directory: packages/expo-emulator-capture
        run: |
          library=dist/linux-x64/libexpo_emulator_capture_nvidia.so
          test -s "$library"
          nm -D --defined-only "$library"
          exports=$(nm -D --defined-only --format=posix "$library" | awk '{print $1}')
          if [ "$exports" != expo_emulator_capture_version ]; then
            echo 'Only expo_emulator_capture_version may be exported'
            exit 1
          fi
          readelf -d "$library"
          if readelf -d "$library" | grep NEEDED | grep -E 'cuda|nvidia|avcodec|avutil|x264'; then
            echo 'GPU/codec runtimes must not be loader dependencies'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: emulator-capture-nvidia-linux-x64
          path: packages/expo-emulator-capture/dist/linux-x64/libexpo_emulator_capture_nvidia.so
