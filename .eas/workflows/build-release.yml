name: Build release packages

# Dispatched by the GitHub Release workflow with --ref set to the commit to
# release. Builds and tests every workspace, then packs the publishable
# packages into one archive that the GitHub workflow downloads and publishes.
on:
  workflow_dispatch:
    inputs:
      canary:
        type: boolean
        description: Version the packages as a canary prerelease before building
        default: false

defaults:
  tools:
    node: 24
    bun: 1.3.14

jobs:
  package:
    name: Build, test, and pack npm packages
    runs_on: macos-medium
    image: latest
    steps:
      - uses: eas/checkout

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify pending changesets
        run: |
          if [ "${{ inputs.canary }}" != "true" ]; then
            ./scripts/verify-pending-changesets.ts
          fi

      - name: Apply version bump & generate changelog
        run: bun run changeset:version

      - name: Apply canary version
        run: |
          if [ "${{ inputs.canary }}" = "true" ]; then
            ./scripts/apply-canary-version.ts
          fi

      - name: Summarize versions
        run: ./scripts/summarize-versions.ts

      # Capture only versioning changes, before build/test outputs can alter the tree.
      - name: Capture version changes
        run: |
          if [ "${{ inputs.canary }}" != "true" ]; then
            mkdir -p release-artifacts
            git add -A
            git diff --cached --binary > release-artifacts/version.patch
          fi

      - name: Build packages
        run: bun run build

      - name: Test
        run: bun run test

      - name: Pack packages
        run: |
          ./scripts/pack-packages.ts release-artifacts
          tar -czf npm-packages.tgz -C release-artifacts .

      - name: Upload npm packages
        uses: eas/upload_artifact
        with:
          type: other
          name: npm-packages
          path: npm-packages.tgz
