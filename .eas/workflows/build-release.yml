name: Build release packages

# Dispatched by the GitHub Release workflow with --ref set to the commit to
# release. Builds and tests every workspace, then packs the publishable
# packages into one archive that the GitHub workflow downloads and publishes.
on:
  workflow_dispatch:
    inputs:
      canary:
        type: boolean
        description: Version the packages as a canary prerelease before packing
        default: false

defaults:
  tools:
    node: 24
    bun: 1.3.14

jobs:
  package:
    name: Build, test, and pack npm packages
    runs_on: macos-medium
    image: latest
    steps:
      - uses: eas/checkout

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Test
        run: bun run test

      # Real releases arrive already versioned by the GitHub workflow's commit.
      # Canary versions are never committed, so they are applied here.
      - name: Apply canary version
        run: |
          if [ "${{ inputs.canary }}" = "true" ]; then
            bun run changeset:version
            ./scripts/apply-canary-version.ts
          else
            echo "Not a canary release; keeping committed versions."
          fi

      - name: Pack packages
        run: |
          ./scripts/pack-packages.ts release-artifacts
          tar -czf npm-packages.tgz -C release-artifacts .

      - name: Upload npm packages
        uses: eas/upload_artifact
        with:
          type: other
          name: npm-packages
          path: npm-packages.tgz
