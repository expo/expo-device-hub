name: Checks

on:
  push:
    branches: [main]
  pull_request: {}
  pull_request_labeled:
    labels: [eas-approved]

concurrency:
  cancel_in_progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ workflow.filename }}-${{ github.ref }}

defaults:
  tools:
    node: 24
    bun: 1.3.14

jobs:
  check:
    name: check
    runs_on: linux-medium
    # The production EAS environment holds a TURBO_TOKEN with write access.
    # Only .eas/workflows/build-release-cache.yml writes the remote cache.
    env:
      TURBO_CACHE: local:rw,remote:r
    steps:
      - uses: eas/checkout

      # Runs on the clean checkout, before any build: ref-check also scans
      # git-ignored output such as packages/expo-device-hub/vendor/.
      - name: LLP references
        run: python3 .llp/ref-check --root .

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # --only prevents dependencies from reintroducing the macOS-only serve-sim build.
      - name: Build packages (excluding serve-sim)
        run: bun run build --filter='!@expo/serve-sim' --only

      # The Android Hub imports serve-sim's middleware, and Android recording
      # does not run for serve-sim-only changes. Check that it starts on Node.
      - name: Serve-sim middleware startup on Node
        run: bun run --filter '@expo/serve-sim' test:middleware-startup

      # --only skips the native serve-sim build; its typecheck only needs sources.
      - name: Typecheck
        run: bunx turbo run typecheck --only

      # --retry=1 runs a failed test once more. A failed beforeAll and a file that
      # fails to load stay red.
      - name: Test
        run: bunx turbo run test -- --retry=1

      - name: Serve-emu critical coverage
        run: bun run --filter serve-emu coverage

      - name: Serve-emu documentation and package checks
        run: |
          bun run --filter serve-emu docs:check
          bun run --filter serve-emu test:package
