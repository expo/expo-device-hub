name: serve-sim tests

on:
  # The Simulator jobs take several macOS machines. They run on a PR that is ready for
  # review, and on a draft only with the ci-ready label; adding the label starts a run.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    if: ${{ !github.event.pull_request.draft || contains(toJSON(github.event.pull_request.labels), 'ci-ready') }}
    paths:
      - packages/serve-sim/**
      - .eas/workflows/sim-test.yml
      - .eas/functions/restore-sim-test-build/**
      - .eas/functions/test-sim-runtime/**
      - .eas/functions/install-mitmproxy/**
  # The same rule for labels: ci-ready starts a draft, and eas-approved starts only a ready PR.
  pull_request_labeled:
    labels: [ci-ready, eas-approved]
    if: ${{ !github.event.pull_request.draft || contains(toJSON(github.event.pull_request.labels), 'ci-ready') }}

# Cancel superseded runs so pushing twice to the same PR does not consume two
# macOS workers in parallel.
concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

defaults:
  tools:
    node: 24
    bun: 1.3.14

jobs:
  build:
    name: Build serve-sim with Xcode 26
    runs_on: macos-medium
    image: macos-tahoe-26.5-xcode-26.6
    outputs:
      artifact_id: ${{ steps.upload_build.outputs.artifact_id }}
    steps:
      - uses: eas/checkout

      # Installs the monorepo root lockfile (bun.lock); serve-sim resolves through it.
      - uses: eas/install_node_modules

      # The permissions e2e test drives the built CLI (dist/serve-sim.js), so
      # build it before running the test suite.
      - name: Build serve-sim
        run: bun run build.ts
        working_directory: packages/serve-sim/packages/serve-sim

      - name: Build native test fixtures
        run: bash Sources/build-test-fixtures.sh
        working_directory: packages/serve-sim/packages/serve-sim

      # Packed before the tests run so the tarball exists even when they fail:
      # a build is often worth trying on a device precisely because the tests
      # did not settle the question.
      - name: Create npm package
        working_directory: packages/serve-sim/packages/serve-sim
        run: |
          mkdir -p release
          npm pack --pack-destination release --json > /tmp/npm-pack.json
          TARBALL=$(node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename' < /tmp/npm-pack.json)
          mv "release/$TARBALL" release/serve-sim.tgz

      - name: Upload npm package
        uses: eas/upload_artifact
        with:
          type: other
          name: serve-sim-npm-package
          path: packages/serve-sim/packages/serve-sim/release/serve-sim.tgz

      - name: Archive the built package and fixtures
        working_directory: packages/serve-sim/packages/serve-sim
        run: |
          tar -czf /tmp/serve-sim-e2e.tar.gz dist
          shasum -a 256 /tmp/serve-sim-e2e.tar.gz

      - name: Upload E2E build
        id: upload_build
        uses: eas/upload_artifact
        with:
          type: other
          name: serve-sim-e2e-build
          path: /tmp/serve-sim-e2e.tar.gz

  unit-tests:
    name: Isolated serve-sim unit tests
    needs: [build]
    runs_on: macos-medium
    image: macos-tahoe-26.5-xcode-26.6
    steps:
      - uses: ./.eas/functions/restore-sim-test-build
        with:
          artifact_id: ${{ needs.build.outputs.artifact_id }}
      # Real mitmdump unit coverage, such as upstream-mitmdump.test.ts, skips without it.
      - uses: ./.eas/functions/install-mitmproxy

      - name: Run two isolated unit shards
        working_directory: packages/serve-sim
        run: |
          pids=()
          for shard in 1 2; do
            bun run test -- --path-ignore-patterns='**/*.e2e.test.*' --shard=$shard/2 --retry=1 &
            pids+=($!)
          done
          result=0
          for pid in "${pids[@]}"; do wait "$pid" || result=1; done
          exit "$result"

  # The e2e files run one at a time, so each runtime splits them over two machines; see test-sim-runtime.
  sim-test-26:
    name: Xcode 26 build on Xcode 26 runtime (1/2)
    needs: [build]
    runs_on: macos-medium
    image: macos-tahoe-26.5-xcode-26.6
    steps:
      - uses: ./.eas/functions/restore-sim-test-build
        with:
          artifact_id: ${{ needs.build.outputs.artifact_id }}
      - uses: ./.eas/functions/install-mitmproxy
      - uses: ./.eas/functions/test-sim-runtime
        with:
          group: slow

  sim-test-26-shard2:
    name: Xcode 26 build on Xcode 26 runtime (2/2)
    needs: [build]
    runs_on: macos-medium
    image: macos-tahoe-26.5-xcode-26.6
    steps:
      - uses: ./.eas/functions/restore-sim-test-build
        with:
          artifact_id: ${{ needs.build.outputs.artifact_id }}
      - uses: ./.eas/functions/install-mitmproxy
      - uses: ./.eas/functions/test-sim-runtime
        with:
          group: rest

  sim-test-27:
    name: Xcode 26 build on Xcode 27 runtime (1/2)
    needs: [build]
    runs_on: macos-medium
    image: macos-tahoe-26.6-xcode-27.1
    steps:
      - uses: ./.eas/functions/restore-sim-test-build
        with:
          artifact_id: ${{ needs.build.outputs.artifact_id }}
      - uses: ./.eas/functions/install-mitmproxy
      - uses: ./.eas/functions/test-sim-runtime
        with:
          group: slow

  sim-test-27-shard2:
    name: Xcode 26 build on Xcode 27 runtime (2/2)
    needs: [build]
    runs_on: macos-medium
    image: macos-tahoe-26.6-xcode-27.1
    steps:
      - uses: ./.eas/functions/restore-sim-test-build
        with:
          artifact_id: ${{ needs.build.outputs.artifact_id }}
      - uses: ./.eas/functions/install-mitmproxy
      - uses: ./.eas/functions/test-sim-runtime
        with:
          group: rest
