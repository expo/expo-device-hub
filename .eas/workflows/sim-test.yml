name: serve-sim tests

on:
  pull_request:
    paths:
      - packages/serve-sim/**
      - scripts/ci/**
      - .eas/workflows/sim-test.yml
  pull_request_labeled:
    labels: [eas-approved]

# Cancel superseded runs so pushing twice to the same PR does not consume two
# macOS workers in parallel.
concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

defaults:
  tools:
    node: 24
    bun: 1.3.14

jobs:
  sim-test:
    name: Build and test serve-sim
    runs_on: macos-medium
    image: latest
    steps:
      - uses: eas/checkout

      # Installs the monorepo root lockfile (bun.lock); serve-sim resolves through it.
      - uses: eas/install_node_modules

      # Gatekeeper has rejected the mitmproxy 12.2.3 cask as unnotarized since
      # 2026-10-06, and a quarantined first launch never returns
      # (mitmproxy/mitmproxy#8474), so take the cask out of quarantine.
      - name: Install mitmproxy
        run: |
          brew install --cask mitmproxy
          xattr -dr com.apple.quarantine "$(brew --prefix)/Caskroom/mitmproxy"
          # Fail here, not in the capture tests, when mitmdump cannot start.
          mitmdump=$(realpath "$(command -v mitmdump)")
          if xattr -p com.apple.quarantine "$mitmdump" >/dev/null 2>&1; then
            echo "::error::$mitmdump is still quarantined"
            exit 1
          fi
          # Check the exact binary capture will select, including SERVE_SIM_MITMDUMP.
          cd packages/serve-sim
          bun packages/serve-sim/scripts/test/check-mitmproxy.ts

      # The permissions e2e test drives the built CLI (dist/serve-sim.js), so
      # build it before running the test suite.
      - name: Build serve-sim
        run: bun run build.ts
        working_directory: packages/serve-sim/packages/serve-sim

      - name: Build native test fixtures
        run: bash Sources/build-test-fixtures.sh
        working_directory: packages/serve-sim/packages/serve-sim

      # Packed before the tests run so the tarball exists even when they fail:
      # a build is often worth trying on a device precisely because the tests
      # did not settle the question.
      - name: Create npm package
        working_directory: packages/serve-sim/packages/serve-sim
        run: |
          mkdir -p release
          npm pack --pack-destination release --json > /tmp/npm-pack.json
          TARBALL=$(node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename' < /tmp/npm-pack.json)
          mv "release/$TARBALL" release/serve-sim.tgz

      - name: Upload npm package
        uses: eas/upload_artifact
        with:
          type: other
          name: serve-sim-npm-package
          path: packages/serve-sim/packages/serve-sim/release/serve-sim.tgz

      - name: Install Chrome for Testing
        run: bunx @puppeteer/browsers@3.2.3 install chrome@154.0.8037.57 --path "$HOME/.cache/chrome-for-testing" --format '{{path}}' > /tmp/chrome-path

      - name: Start iOS Simulator
        uses: eas/start_ios_simulator

      - name: Run serve-sim tests
        # An unmet precondition fails instead of skipping; see e2e-preconditions.ts.
        # Runs from the serve-sim tree root so the attribution test finds its NOTICE.
        env:
          SERVE_SIM_E2E_REQUIRED: "1"
        working_directory: packages/serve-sim
        run: |
          export SERVE_SIM_CHROME="$(cat /tmp/chrome-path)"
          SERVE_SIM_TEST_UDID="$(bash packages/serve-sim/scripts/test/select-ci-simulator.sh)"
          export SERVE_SIM_TEST_UDID
          exec bun ../../scripts/ci/bun-test-retry.ts \
            --before-retry=packages/serve-sim/scripts/test/reboot-ci.sh \
            -- --max-concurrency=1 packages/serve-sim/src/ packages/serve-sim/scripts/tart/__tests__/
