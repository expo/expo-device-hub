<section id="macos-frame-rate-view" data-viz-composition>

      "id": "macos-frame-rate",
      "title": "Capture frame rate · M2",
      "description": "20-second sessions · 60 FPS requested · November 4, 2026",

  const root = document.getElementById("macos-frame-rate-view");
  mountChart(
    root.querySelector("[data-viz-container]"),
    JSON.parse(root.querySelector("[data-viz-chart]").textContent),
  );
</script>
