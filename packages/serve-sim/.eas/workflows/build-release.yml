name: Build @expo/serve-sim release

on:
  workflow_dispatch: {}

defaults:
  tools:
    node: 24
    bun: 1.3.13

jobs:
  package:
    name: Build npm package
    runs_on: macos-medium
    image: latest
    steps:
      - uses: eas/checkout

      - name: Install monorepo dependencies
        run: bun install --frozen-lockfile
        working_directory: ../..

      - name: Build native helpers and package
        run: bun run build

      - name: Create npm package
        id: pack
        run: |
          mkdir -p release
          npm pack --pack-destination release --json > /tmp/npm-pack.json
          TARBALL=$(node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename' < /tmp/npm-pack.json)
          mv "release/$TARBALL" release/serve-sim.tgz
          set-output artifact_path "$PWD/release/serve-sim.tgz"

      - name: Upload npm package
        uses: eas/upload_artifact
        with:
          type: other
          name: serve-sim-npm-package
          path: ${{ steps.pack.outputs.artifact_path }}
