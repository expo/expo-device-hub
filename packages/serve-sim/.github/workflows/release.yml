name: Release @expo/serve-sim

run-name: Release @expo/serve-sim (${{ inputs.bump }}) by @${{ github.triggering_actor }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer component to bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

# Only one release may calculate and publish the next version at a time.
concurrency:
  group: release-expo-serve-sim
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    if: github.repository == 'expo/serve-sim' && github.ref == 'refs/heads/expo'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout expo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: expo
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Create release commit
        id: release
        env:
          BUMP: ${{ inputs.bump }}
          DISPATCH_SHA: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          # Ask npm whether a version exists. Only E404 means absent; any
          # other failure is a lookup error and stops the run before it
          # changes anything.
          on_npm() {
            set +e
            LOOKUP=$(npm view "@expo/serve-sim@$1" version 2>&1)
            STATUS=$?
            set -e
            if [ "$STATUS" -eq 0 ] && [ "$LOOKUP" = "$1" ]; then return 0; fi
            if printf '%s' "$LOOKUP" | grep -q 'E404'; then return 1; fi
            # Undo a local version bump so the tree matches the message below.
            git checkout -- packages/serve-sim/package.json
            echo "::error::Could not check npm for @expo/serve-sim@$1. Nothing was changed. Re-run the job."
            printf '%s\n' "$LOOKUP"
            exit 1
          }

          REUSED=false
          PUBLISHED=false
          LAST_RUN_ID=$(git log -1 --format='%(trailers:key=Release-Run,valueonly)')
          if [ "$LAST_RUN_ID" = "$RELEASE_RUN_ID" ] && [ "$(git rev-parse HEAD^)" = "$DISPATCH_SHA" ]; then
            echo "Reusing the release commit created by this run."
            REUSED=true
            VERSION=$(node -p "require('./packages/serve-sim/package.json').version")
            if on_npm "$VERSION"; then
              echo "@expo/serve-sim@$VERSION is already on npm from an earlier attempt of this run. Skipping the build and publish steps."
              PUBLISHED=true
            fi
          elif [ "$(git rev-parse HEAD)" != "$DISPATCH_SHA" ]; then
            echo "::error::expo moved after this release was started. Start a new release from the latest expo."
            exit 1
          else
            npm version "$BUMP" --no-git-tag-version --no-package-lock --no-workspaces-update --workspace packages/serve-sim
            VERSION=$(node -p "require('./packages/serve-sim/package.json').version")
            # Refuse before the commit and tag exist. A version that is already
            # on npm was published outside this workflow, and tagging this
            # source for it would lie about what the package contains.
            if on_npm "$VERSION"; then
              git checkout -- packages/serve-sim/package.json
              echo "::error::@expo/serve-sim@$VERSION is already on npm and was not published by this workflow. Nothing was committed or tagged. Choose a different bump or fix npm first."
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/serve-sim/package.json
            git commit -m "Release @expo/serve-sim $VERSION" -m "Release-Run: $RELEASE_RUN_ID"
            git tag "@expo/serve-sim@$VERSION"
            git push --atomic origin HEAD:expo "refs/tags/@expo/serve-sim@$VERSION"
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "reused=$REUSED" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"

      - name: Build npm package with EAS
        if: steps.release.outputs.published != 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_DEV_EXPO_GITHUB_ROBOT_ACCESS_TOKEN }}
        run: |
          npx --yes eas-cli@latest workflow:run .eas/workflows/build-release.yml \
            --ref "${{ steps.release.outputs.sha }}" \
            --wait \
            --non-interactive \
            --json > /tmp/eas-workflow.json

      - name: Download EAS artifact
        if: steps.release.outputs.published != 'true'
        run: |
          ARTIFACT_URL=$(jq -er '
            .jobs[]
            | .turtleJobRun.artifacts[]?
            | select(.name == "serve-sim-npm-package")
            | .downloadUrl
          ' /tmp/eas-workflow.json)
          curl --fail --location "$ARTIFACT_URL" --output /tmp/serve-sim.tgz

      - name: Publish to npm with OIDC
        if: steps.release.outputs.published != 'true'
        env:
          REUSED: ${{ steps.release.outputs.reused }}
        run: |
          VERSION=$(tar -xOf /tmp/serve-sim.tgz package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          EXPECTED=$(node -p "require('./packages/serve-sim/package.json').version")
          if [ "$VERSION" != "$EXPECTED" ]; then
            echo "::error::tarball is $VERSION but the release commit is $EXPECTED"
            exit 1
          fi

          # Ask npm whether this exact version exists. E404 is the one answer
          # that means "absent"; any other failure is a lookup error, and
          # publishing on a guess would strand a re-run behind npm's
          # duplicate-version rejection.
          set +e
          LOOKUP=$(npm view "@expo/serve-sim@$VERSION" version 2>&1)
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ] && [ "$LOOKUP" = "$VERSION" ]; then
            # Only a re-run of the run that created this release commit may
            # skip the publish. Any other history means someone published this
            # version outside the workflow, and tagging this source for it
            # would be wrong.
            if [ "$REUSED" != "true" ]; then
              echo "::error::@expo/serve-sim@$VERSION is already on npm and this run did not create its release commit. Refusing to tag it."
              exit 1
            fi
            echo "::notice::@expo/serve-sim@$VERSION was published by an earlier attempt of this run. Skipping publish."
          elif printf '%s' "$LOOKUP" | grep -q 'E404'; then
            npm publish /tmp/serve-sim.tgz
          else
            echo "::error::Could not check npm for @expo/serve-sim@$VERSION. Re-run the job."
            printf '%s\n' "$LOOKUP"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          VERSION=$(node -p "require('./packages/serve-sim/package.json').version")
          TAG="@expo/serve-sim@$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi

          # Notes cover the PRs merged since the previous release tag.
          git fetch --quiet origin 'refs/tags/@expo/serve-sim@*:refs/tags/@expo/serve-sim@*'
          PREVIOUS=$(git tag --list '@expo/serve-sim@*' \
            | sed 's|^@expo/serve-sim@||' \
            | sort -V \
            | grep -x -B1 "$VERSION" \
            | head -1)
          START=()
          if [ -n "$PREVIOUS" ] && [ "$PREVIOUS" != "$VERSION" ]; then
            START=(--notes-start-tag "@expo/serve-sim@$PREVIOUS")
          fi

          gh release create "$TAG" \
            --target "$SHA" \
            --title "@expo/serve-sim $VERSION" \
            --verify-tag \
            --generate-notes "${START[@]}"
