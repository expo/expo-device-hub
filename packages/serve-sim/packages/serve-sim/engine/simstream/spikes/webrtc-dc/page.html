<!doctype html>
<html><head><meta charset="utf-8"><title>simstream over WebRTC data channel (__MODE__)</title>
<style>html,body{margin:0;background:#000;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;height:100vh;margin:0 auto}
.buttons{position:fixed;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.buttons button{padding:8px 14px;border:1px solid #2c2c32;border-radius:8px;background:#17171b;color:#cfd2d6;font:13px system-ui;cursor:pointer}</style>
</head><body><canvas id="screen"></canvas>
<div class="buttons"><button data-button="home">Home</button><button data-button="lock">Lock</button></div>
<script>
// Spike page: the simstream engine's stream over a WebRTC data channel (see bridge.mjs).
// Decode and presentation match serve-sim's use-simstream-stream.ts, so the transport is the only
// difference from the WebSocket path.
const MODE = '__MODE__';
const HEADER = 49, CHUNK_HEADER = 12;
// How long a missing frame may hold up decoding before it's declared lost and we resync.
const LOSS_WAIT_MS = MODE === 'nack' ? 300 : 60;
const LOSSY = MODE === 'unreliable' || MODE === 'nack';
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
const stats = window.__stats = { frames: 0, decoded: 0, lostFrames: 0, keyRequests: 0, heldForOrder: 0, maxChunkGapMs: 0 };
let lastChunkAt = 0;

let ctl = null, ackChannel = null, decoder = null, waitingForKey = true;
const send = (m) => ctl && ctl.readyState === 'open' && ctl.send(JSON.stringify(m));
// Acks go on the unreliable 'ack' channel when the bridge offers one (cumulative, so loss is harmless).
const sendAck = (seq) => {
  const m = JSON.stringify({ t: 'ack', seq });
  if (ackChannel && ackChannel.readyState === 'open') ackChannel.send(m); else send({ t: 'ack', seq });
};

// Presentation: draw as soon as decoded, at most once per display refresh (latest wins).
let latest = null, drawnThisRefresh = false, rafScheduled = false;
function present(frame) {
  drawnThisRefresh = true;
  ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);
  frame.close();
}
function schedule() {
  if (rafScheduled) return;
  rafScheduled = true;
  requestAnimationFrame(() => {
    rafScheduled = false; drawnThisRefresh = false;
    if (latest) { const f = latest; latest = null; present(f); schedule(); }
  });
}

function configure(c) {
  if (decoder && decoder.state !== 'closed') decoder.close();
  canvas.width = c.displayWidth ?? c.width; canvas.height = c.displayHeight ?? c.height;
  decoder = new VideoDecoder({
    output: (frame) => {
      stats.decoded++;
      const t0 = decodeStarted.get(frame.timestamp);
      if (t0 !== undefined) { decodeStarted.delete(frame.timestamp); if (metrics.recording) metrics.decodeLat.push(performance.now() - t0); }
      sendAck(frame.timestamp);
      if (!drawnThisRefresh) present(frame); else { latest?.close(); latest = frame; }
      schedule();
    },
    error: () => { waitingForKey = true; requestKey(); },
  });
  decoder.configure({ codec: c.codec, codedWidth: c.width, codedHeight: c.height,
    description: Uint8Array.from(atob(c.description), (ch) => ch.charCodeAt(0)),
    optimizeForLatency: true, hardwareAcceleration: 'prefer-hardware' });
  waitingForKey = true;
}
let lastKeyRequest = 0;
function requestKey() {
  const now = performance.now();
  if (now - lastKeyRequest < 200) return;
  lastKeyRequest = now; stats.keyRequests++; send({ t: 'keyframe' });
}

// Diagnostics: every gap between decoded frames > 120 ms, with the reassembly state at that moment.
stats.stalls = [];
let lastFrameAt = 0;
function noteStall(now) {
  if (lastFrameAt && now - lastFrameAt > 120 && stats.stalls.length < 60) {
    stats.stalls.push({ at: Math.round(now), gapMs: Math.round(now - lastFrameAt), missing: typeof missing !== 'undefined' ? missing.size : -1,
      complete: complete.size, partial: partial.size, waitingForKey, nextId, lost: stats.lostFrames, keyReq: stats.keyRequests,
      maxChunkGapMs: stats.maxChunkGapMs });
    stats.maxChunkGapMs = 0;
  }
  lastFrameAt = now;
}
// In-page metrics (no pixel readback): frame age from the header's capture time (server clock),
// corrected by an NTP-style clock offset against the server's time endpoint.
const metrics = window.__metrics = { offsetMs: 0, ages: [], decodeTimes: [], xfers: [], decodeLat: [], recording: false };
const decodeStarted = new Map();   // seq -> performance.now() at decode()
async function measureOffset() {
  const samples = [];
  for (let i = 0; i < 25; i++) {
    const t0 = Date.now(); const server = Number(await (await fetch(`http://${location.hostname}:8815/mono`, { cache: 'no-store' })).text()); const t1 = Date.now();
    samples.push({ rtt: t1 - t0, off: (t0 + t1) / 2 - server });
    await new Promise((r) => setTimeout(r, 40));
  }
  samples.sort((a, b) => a.rtt - b.rtt);
  metrics.offsetMs = samples.slice(0, 6).reduce((a, x) => a + x.off, 0) / 6;
}
measureOffset().catch(() => {});
window.__startRecording = () => { metrics.ages = []; metrics.decodeTimes = []; metrics.xfers = []; metrics.decodeLat = []; metrics.recording = true; };
window.__summary = () => {
  const a = metrics.ages.slice().sort((x, y) => x - y), d = metrics.decodeTimes;
  const q = (p) => a.length ? a[Math.min(a.length - 1, Math.floor(p * a.length))] : null;
  const gaps = d.slice(1).map((t, i) => t - d[i]);
  const secs = d.length > 1 ? (d[d.length - 1] - d[0]) / 1000 : 1;
  return { mode: MODE, frames: d.length, fps: +(d.length / secs).toFixed(1),
    ageMean: +(a.reduce((x, y) => x + y, 0) / (a.length || 1)).toFixed(1), ageP50: q(0.5), ageP95: q(0.95), ageP99: q(0.99),
    freezes50: gaps.filter((g) => g > 50).length, worstGapMs: Math.round(Math.max(0, ...gaps)), offsetMs: +metrics.offsetMs.toFixed(1),
    stalls: stats.stalls.length, nacks: stats.nacksSent, lost: stats.lostFrames, keyReq: stats.keyRequests,
    // Frames over 50 KB: first-to-last chunk arrival (how fast the transport delivers a big frame).
    ...(() => { const big = metrics.xfers.filter((x) => x.bytes > 50_000); const ms = big.map((x) => x.ms).sort((x, y) => x - y);
      const pq = (p) => ms.length ? Math.round(ms[Math.min(ms.length - 1, Math.floor(p * ms.length))]) : null;
      const mbps = big.length ? +(big.reduce((n, x) => n + x.bytes, 0) * 8 / 1000 / big.reduce((n, x) => n + Math.max(1, x.ms), 0)).toFixed(1) : null;
      const dl = metrics.decodeLat.slice().sort((x, y) => x - y);
      // Per second: frames decoded and median frame age relative to the run's lowest age (clock offset cancels).
      const minAge = Math.min(...metrics.ages); const t0 = metrics.decodeTimes[0] ?? 0; const buckets = [];
      metrics.decodeTimes.forEach((t, i) => { const b = Math.floor((t - t0) / 1000); (buckets[b] ??= []).push(metrics.ages[i] - minAge); });
      const timeline = [...buckets].map((b) => b ? `${b.length}f/${Math.round(b.sort((x, y) => x - y)[b.length >> 1])}ms` : '0f');
      return { timeline, bigFrames: big.length, bigXferP50: pq(0.5), bigXferP95: pq(0.95), bigXferMbps: mbps,
        decodeP50: dl.length ? +dl[Math.floor(dl.length / 2)].toFixed(1) : null, decodeP95: dl.length ? +dl[Math.floor(dl.length * 0.95)].toFixed(1) : null }; })() };
};
function decodeFrame(buf) {
  stats.frames++;
  noteStall(performance.now());
  if (metrics.recording) {
    const dv0 = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
    metrics.ages.push(Date.now() - metrics.offsetMs - dv0.getFloat64(5, true));
    metrics.decodeTimes.push(performance.now());
  }
  const view = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  const isKey = (view.getUint8(0) & 1) === 1, seq = view.getUint32(1, true);
  if (!decoder || decoder.state !== 'configured') return;
  if (waitingForKey && !isKey) return;
  waitingForKey = false;
  decodeStarted.set(seq, performance.now());
  if (decodeStarted.size > 300) decodeStarted.delete(decodeStarted.keys().next().value);
  decoder.decode(new EncodedVideoChunk({ type: isKey ? 'key' : 'delta', timestamp: seq, data: buf.subarray(HEADER) }));
}

// NACK: spot gaps in the chunk sequence, ask the bridge to resend, repeat until they arrive.
let expectedSeq = null;
const missing = new Map();   // chunkSeq -> first-missed time
stats.nacksSent = 0; stats.recovered = 0;
function trackChunk(seq) {
  if (missing.delete(seq)) { stats.recovered++; return; }
  if (expectedSeq === null) { expectedSeq = seq + 1; return; }
  if (seq < expectedSeq) return;
  const now = performance.now();
  for (let s = expectedSeq; s < seq && missing.size < 500; s++) missing.set(s, now);
  if (seq > expectedSeq) sendNacks();
  expectedSeq = seq + 1;
}
function sendNacks() {
  const now = performance.now();
  for (const [s, t] of missing) if (now - t > 1000) missing.delete(s);   // gave up: frame-level loss handles it
  if (!missing.size) return;
  const m = JSON.stringify({ t: 'nack', seqs: [...missing.keys()].slice(0, 100) });
  stats.nacksSent++;
  if (ackChannel && ackChannel.readyState === 'open') ackChannel.send(m); else ctl?.readyState === 'open' && ctl.send(m);
}
if (MODE === 'nack') setInterval(() => missing.size && sendNacks(), 30);

// Reassembly, in frame order.
const partial = new Map();   // id -> { count, got, parts }
const complete = new Map();  // id -> Uint8Array (whole frame)
let nextId = null, gapSince = 0;
function onChunk(data) {
  const now = performance.now();
  if (lastChunkAt) stats.maxChunkGapMs = Math.max(stats.maxChunkGapMs, Math.round(now - lastChunkAt));
  lastChunkAt = now;
  const u8 = new Uint8Array(data), dv = new DataView(data);
  const id = dv.getUint32(0, true), idx = dv.getUint16(4, true), count = dv.getUint16(6, true), cseq = dv.getUint32(8, true);
  if (MODE === 'nack') trackChunk(cseq);
  if (nextId === null) nextId = id;
  if (id < nextId) return;
  let p = partial.get(id);
  if (!p) partial.set(id, p = { count, got: 0, parts: new Array(count), first: now });
  if (!p.parts[idx]) { p.parts[idx] = u8.subarray(CHUNK_HEADER); p.got++; }
  if (p.got === p.count) {
    partial.delete(id);
    const len = p.parts.reduce((n, x) => n + x.length, 0), whole = new Uint8Array(len);
    let o = 0; for (const x of p.parts) { whole.set(x, o); o += x.length; }
    complete.set(id, whole);
    if (metrics.recording) metrics.xfers.push({ ms: now - p.first, bytes: len });
  }
  drain();
}
function drain() {
  while (complete.has(nextId)) { decodeFrame(complete.get(nextId)); complete.delete(nextId); nextId++; gapSince = 0; }
  if (!complete.size) return;
  stats.heldForOrder++;
  // A newer frame is complete but nextId isn't: reliable modes wait for the retransmit;
  // unreliable gives up after LOSS_WAIT_MS, skips to the newest complete keyframe if any.
  if (!LOSSY) return;
  const now = performance.now();
  if (!gapSince) { gapSince = now; setTimeout(drain, LOSS_WAIT_MS + 5); return; }
  if (now - gapSince < LOSS_WAIT_MS) return;
  const ids = [...complete.keys()].sort((a, b) => a - b);
  const keyId = ids.filter((i) => (complete.get(i)[0] & 1) === 1).pop();
  stats.lostFrames += (keyId ?? ids[0]) - nextId;
  for (const i of [...partial.keys()]) if (i < (keyId ?? ids[0])) partial.delete(i);
  if (keyId !== undefined) {
    for (const i of ids) if (i < keyId) complete.delete(i);
    nextId = keyId;
  } else {
    for (const i of ids) complete.delete(i);
    nextId = ids[ids.length - 1] + 1;
    waitingForKey = true; requestKey();
  }
  gapSince = 0; drain();
}

// Control mode: talk to the engine's WebSocket directly, same decode path.
if (MODE === 'ws') {
  const ws = new WebSocket(`ws://${location.hostname}:__ENGINE_PORT__/stream`);
  ws.binaryType = 'arraybuffer';
  ctl = { get readyState() { return ws.readyState === 1 ? 'open' : 'closed'; }, send: (m) => ws.send(m) };
  ws.onopen = () => { send({ t: 'hello', codecs: ['h264'] }); send({ t: 'settings', transitions: new URLSearchParams(location.search).get('transitions') || 'burst', hevc: false }); };
  let nextSeqWs = 0;
  ws.onmessage = (e) => {
    if (typeof e.data === 'string') { const m = JSON.parse(e.data); if (m.t === 'config') configure(m); return; }
    decodeFrame(new Uint8Array(e.data));
  };
}
// Signaling: the bridge offers, the page answers.
const signal = MODE === 'ws' ? { send() {}, set onmessage(_) {} } : new WebSocket(location.origin.replace(/^http/, 'ws') + '/signal');
const pc = new RTCPeerConnection({ iceServers: [] });
pc.onicecandidate = (e) => e.candidate && signal.send(JSON.stringify({ t: 'cand', candidate: e.candidate.candidate, mid: e.candidate.sdpMid }));
pc.ondatachannel = ({ channel }) => {
  channel.binaryType = 'arraybuffer';
  if (channel.label === 'video') channel.onmessage = (e) => onChunk(e.data);
  if (channel.label === 'ack') ackChannel = channel;
  if (channel.label === 'ctl') {
    ctl = channel;
    channel.onopen = () => { send({ t: 'hello', codecs: ['h264'] }); send({ t: 'settings', transitions: new URLSearchParams(location.search).get('transitions') || 'burst', hevc: false }); };
    channel.onmessage = (e) => { const m = JSON.parse(e.data); if (m.t === 'config') configure(m); };
  }
};
signal.onmessage = async (e) => {
  const m = JSON.parse(e.data);
  if (m.t === 'sdp') {
    await pc.setRemoteDescription({ type: m.type, sdp: m.sdp });
    if (m.type === 'offer') {
      await pc.setLocalDescription(await pc.createAnswer());
      signal.send(JSON.stringify({ t: 'sdp', sdp: pc.localDescription.sdp, type: pc.localDescription.type }));
    }
  }
  if (m.t === 'cand') { try { await pc.addIceCandidate({ candidate: m.candidate, sdpMid: m.mid }); } catch {} }
};
// Input, as in the engine's own page (Sources/simstream/Web/index.html): touches, edge swipes, keys
// and hardware buttons go on the reliable ctl channel; the bridge passes them to the engine.
const EDGE = { none: 0, top: 1, left: 2, bottom: 3, right: 4 };
const EDGE_ZONE = { x: 0.04, y: 0.03 };
const BEZEL_PX = 32;
let gesture = null, inputSeq = 0;
function position(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height, r };
}
function edgeAt({ x, y }) {
  if (y >= 1 - EDGE_ZONE.y) return EDGE.bottom;
  if (x <= EDGE_ZONE.x) return EDGE.left;
  if (x >= 1 - EDGE_ZONE.x) return EDGE.right;
  if (y <= EDGE_ZONE.y) return EDGE.top;
  return EDGE.none;
}
const clamp = (v) => Math.min(1, Math.max(0, v));
function touch(phase, e) {
  let { x, y } = position(e);
  if (phase === 'down') {
    if (gesture.edge === EDGE.bottom) y = 0.999;
    if (gesture.edge === EDGE.top) y = 0.001;
    if (gesture.edge === EDGE.left) x = 0.001;
    if (gesture.edge === EDGE.right) x = 0.999;
  }
  send({ t: 'touch', p: phase, x: clamp(x), y: clamp(y), seq: ++inputSeq, edge: gesture.edge });
}
document.addEventListener('pointerdown', (e) => {
  if (gesture || e.target.closest('button')) return;
  const p = position(e);
  const bezelX = BEZEL_PX / p.r.width, bezelY = BEZEL_PX / p.r.height;
  const onScreen = p.x >= 0 && p.x <= 1 && p.y >= 0 && p.y <= 1;
  if (!(p.x >= -bezelX && p.x <= 1 + bezelX && p.y >= -bezelY && p.y <= 1 + bezelY)) return;
  e.preventDefault();
  document.body.setPointerCapture(e.pointerId);
  gesture = { pointerId: e.pointerId, edge: onScreen ? edgeAt(p) : edgeAt({ x: clamp(p.x), y: clamp(p.y) }) };
  touch('down', e);
});
document.addEventListener('pointermove', (e) => { if (gesture?.pointerId === e.pointerId) touch('move', e); });
const release = (e) => { if (gesture?.pointerId !== e.pointerId) return; touch('up', e); gesture = null; };
document.addEventListener('pointerup', release);
document.addEventListener('pointercancel', release);

// KeyboardEvent.code -> USB HID usage (page 0x07)
const HID = {
  Enter: 0x28, Escape: 0x29, Backspace: 0x2a, Tab: 0x2b, Space: 0x2c, Minus: 0x2d, Equal: 0x2e,
  BracketLeft: 0x2f, BracketRight: 0x30, Backslash: 0x31, Semicolon: 0x33, Quote: 0x34, Backquote: 0x35,
  Comma: 0x36, Period: 0x37, Slash: 0x38, CapsLock: 0x39, Delete: 0x4c,
  ArrowRight: 0x4f, ArrowLeft: 0x50, ArrowDown: 0x51, ArrowUp: 0x52,
  ControlLeft: 0xe0, ShiftLeft: 0xe1, AltLeft: 0xe2, ControlRight: 0xe4, ShiftRight: 0xe5, AltRight: 0xe6,
};
for (let i = 0; i < 26; i++) HID['Key' + String.fromCharCode(65 + i)] = 0x04 + i;
for (let i = 1; i <= 9; i++) HID['Digit' + i] = 0x1d + i;
HID.Digit0 = 0x27;
function onKey(e, down) {
  if (e.metaKey) return;
  const usage = HID[e.code];
  if (usage === undefined) return;
  e.preventDefault();
  if (down && e.repeat) return;
  send({ t: 'key', usage, down });
}
window.addEventListener('keydown', (e) => onKey(e, true));
window.addEventListener('keyup', (e) => onKey(e, false));
for (const el of document.querySelectorAll('[data-button]')) {
  const b = el.dataset.button;
  el.addEventListener('pointerdown', () => send({ t: 'button', b, down: true }));
  el.addEventListener('pointerup', () => send({ t: 'button', b, down: false }));
}
</script></body></html>
