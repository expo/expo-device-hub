name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Complete package check
            command: bun run --filter serve-emu check
          - name: Unit tests
            command: bun run --filter serve-emu test
          - name: Critical coverage
            command: bun run --filter serve-emu coverage
          - name: Server typecheck
            command: bun run --filter serve-emu typecheck
          - name: UI typecheck
            command: bun run --filter serve-emu typecheck:ui
          - name: Test and script typecheck
            command: bun run --filter serve-emu typecheck:tests
          - name: Production build
            command: bun run --filter serve-emu build
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Bun 1.3.13
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.13

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
